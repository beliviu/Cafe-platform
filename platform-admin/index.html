<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0604" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Mode tampilan sebelum React jalan (lihat src/lib/themeMode.js) — mencegah kedip terang/gelap.
      try {
        var pref = localStorage.getItem('dailybrew.theme') || 'dark'
        var mode = pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref
        document.documentElement.dataset.theme = mode === 'light' ? 'light' : 'dark'
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
    <meta name="description" content="Dashboard platform Dailybrew untuk mengelola kafe berlangganan." />
    <title>Dailybrew Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
